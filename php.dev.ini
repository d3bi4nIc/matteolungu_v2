; Config PHP DOAR pentru dezvoltare locală (php -c php.dev.ini -S localhost:8000)
; NU se folosește pe Hostico. Vezi CMS-SETUP.md.

display_errors = On
error_reporting = E_ALL

; Permite upload de imagini până la 10MB (CMS-ul limitează la 5MB în cod)
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 20
